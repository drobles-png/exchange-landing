<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción por ruta: los pone el router (src/content/copy.ts → SEO).
         Estos son los valores de la carga inicial (lo que leen los bots sin JS). -->
    <title>Exchange Ecuador | Intercambio para tu hijo, en buenas manos</title>
    <meta name="description" content="Programas de intercambio para adolescentes en Estados Unidos, Inglaterra, Canadá e Italia, en grupos pequeños y acompañados por educadores." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0057ff" />

    <!-- Meta Pixel: lo inyecta vite.config.ts (plugin metaPixel) con META_PIXEL_ID de
         src/config/funnel.ts. Vacío = sin pixel. No carga en localhost. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Open Graph. og:image debe ser una URL ABSOLUTA del dominio final (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Exchange Ecuador" />
    <meta property="og:title" content="Exchange Ecuador | Intercambio para tu hijo, en buenas manos" />
    <meta property="og:description" content="Programas de intercambio para adolescentes en Estados Unidos, Inglaterra, Canadá e Italia, en grupos pequeños y acompañados por educadores." />
    <!-- Si cambia el dominio (SITE_URL), actualizar estas URLs. -->
    <meta property="og:url" content="https://exchange-ecuador.vercel.app/" />
    <meta property="og:image" content="https://exchange-ecuador.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exchange Ecuador: tu hijo nunca viaja solo" />
    <meta name="twitter:image" content="https://exchange-ecuador.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
